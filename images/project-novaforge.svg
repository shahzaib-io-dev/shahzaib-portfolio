<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c16"/>
      <stop offset="50%" stop-color="#11162b"/>
      <stop offset="100%" stop-color="#07080f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="rgba(99, 102, 241, 0.35)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <circle cx="600" cy="350" r="400" fill="url(#glow)"/>
  
  <!-- UI Window Mockup -->
  <g transform="translate(180, 110)">
    <rect width="840" height="530" rx="20" fill="#0f1322" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
    <!-- Window Header -->
    <rect width="840" height="50" rx="20" fill="#151b30"/>
    <circle cx="35" cy="25" r="6" fill="#ef4444"/>
    <circle cx="55" cy="25" r="6" fill="#f59e0b"/>
    <circle cx="75" cy="25" r="6" fill="#10b981"/>
    <text x="420" y="32" font-family="-apple-system, sans-serif" font-size="14" fill="#64748b" text-anchor="middle" font-weight="600">novaforge-ai-motion-upgraded.vercel.app</text>
    
    <!-- Hero Mockup in window -->
    <rect x="50" y="80" width="160" height="28" rx="14" fill="rgba(99,102,241,0.15)" stroke="rgba(99,102,241,0.4)"/>
    <text x="130" y="99" font-family="-apple-system, sans-serif" font-size="11" fill="#818cf8" text-anchor="middle" font-weight="700">ENTERPRISE AI SUITE</text>
    
    <text x="50" y="165" font-family="-apple-system, sans-serif" font-size="38" fill="#ffffff" font-weight="800" letter-spacing="-1">From an idea to a</text>
    <text x="50" y="215" font-family="-apple-system, sans-serif" font-size="38" fill="url(#accent)" font-weight="800" letter-spacing="-1">real digital product.</text>
    
    <rect x="50" y="250" width="180" height="42" rx="10" fill="#6366f1"/>
    <text x="140" y="276" font-family="-apple-system, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">Create Project →</text>
    
    <!-- Code Studio Panel on right -->
    <rect x="460" y="80" width="330" height="400" rx="14" fill="#0b0e17" stroke="rgba(255,255,255,0.08)"/>
    <rect x="480" y="110" width="140" height="12" rx="6" fill="#334155"/>
    <rect x="480" y="140" width="220" height="10" rx="5" fill="#1e293b"/>
    <rect x="480" y="165" width="190" height="10" rx="5" fill="#1e293b"/>
    <rect x="480" y="190" width="260" height="10" rx="5" fill="#1e293b"/>
    <rect x="480" y="230" width="290" height="100" rx="10" fill="rgba(99,102,241,0.08)" stroke="rgba(99,102,241,0.2)"/>
    <text x="500" y="260" font-family="monospace" font-size="12" fill="#a5b4fc">&gt; Command: Deploying to Vercel...</text>
    <text x="500" y="285" font-family="monospace" font-size="12" fill="#34d399">✔ Compiled 40/40 routes</text>
    <text x="500" y="310" font-family="monospace" font-size="12" fill="#60a5fa">✔ Database: PostgreSQL connected</text>
  </g>
</svg>